[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-rag"
version = "0.1.0"
description = "Shared foundation for an SC4001 adaptive RAG and abstention study"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "datasets>=2.19,<5",
  "sentence-transformers>=3.0,<6",
  "scikit-learn>=1.4,<2",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "pytest-cov>=5.0,<8", "ruff>=0.5,<1"]
mac = ["mlx>=0.20; platform_system == 'Darwin' and platform_machine == 'arm64'", "mlx-lm>=0.20; platform_system == 'Darwin' and platform_machine == 'arm64'"]
colab = ["torch>=2.2", "transformers>=4.40,<6", "accelerate>=0.30,<2", "bitsandbytes>=0.43; platform_system == 'Linux'"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
