# Select final values using validation data and freeze them before test.
# Runs Qwen through Hugging Face Transformers.

project_seed: 88
data_root: data
cache_root: cache
output_root: outputs

dataset:
  dataset_name: hotpotqa/hotpot_qa
  dataset_config: distractor
  source_split: train
  revision: 1908d6afbbead072334abe2965f91bd2709910ab
  subset_size: 500
  project_split: development
  input_path: null

retrieval:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  embedding_revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
  embedding_device: cpu
  initial_top_k: 3
  followup_top_k: 3
  max_total_retrieval_rounds: 2
  similarity_metric: cosine

slm:
  model_id: Qwen/Qwen3-1.7B
  revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
  runtime: transformers
  quantization: null
  max_input_tokens: 8192
  max_new_tokens: 512
  temperature: 0.0
  do_sample: false
  enable_thinking: false
  prompt_version: v1
  sufficiency_prompt_path: prompts/sufficiency_v1.txt
  final_answer_prompt_path: prompts/final_answer_v1.txt
  structured_retry_prompt_path: prompts/structured_retry_v1.txt
  format_retry_limit: 1

experiment:
  system_variant: rag_abstention
  run_id: development-transformers
