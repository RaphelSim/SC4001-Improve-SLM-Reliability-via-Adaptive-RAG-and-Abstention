# Shared DEVELOPMENT defaults. Select final values using validation data and freeze them before test.
project_seed: 42
data_root: data
cache_root: cache
output_root: outputs

dataset:
  dataset_name: hotpotqa
  development_split: development
  validation_split: validation
  test_split: test
  development_path: null
  validation_path: null
  test_path: null

retrieval:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  initial_top_k: 3
  followup_top_k: 3
  max_total_retrieval_rounds: 2
  similarity_metric: cosine
  deduplicate_evidence: true

slm:
  model_id: TBD
  runtime: auto
  quantization: null
  max_input_tokens: 4096
  max_new_tokens: 128
  temperature: 0.0
  do_sample: false

experiment:
  system_variant: adaptive_retrieval_abstention
  evidence_condition: partially_incomplete
  run_id: development
